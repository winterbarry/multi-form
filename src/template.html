<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Step Form</title>
  </head>

  <body>
    <div class="background">
      <div class="form-container">
        <div class="layout">
          <aside class="sidebar">
            <div class="step">
              <div class="number">1</div>
              <div class="text">STEP 1 <br />YOUR INFO</div>
            </div>
            <div class="step">
              <div class="number">2</div>
              <div class="text">STEP 2 <br />SELECT PLAN</div>
            </div>
            <div class="step">
              <div class="number">3</div>
              <div class="text">STEP 3 <br />ADD-ONS</div>
            </div>
            <div class="step">
              <div class="number">4</div>
              <div class="text">STEP 4 <br />SUMMARY</div>
            </div>
          </aside>

          <main class="main">
            <section class="form-content">
              <header>
                <h1>Form Title</h1>
              </header>

              <!-- First Form -->
              <form id="form-1">
                <fieldset>
                  <legend>User Information</legend>

                  <label for="name">Name:</label>
                  <input id="name" type="text" placeholder="Enter your name" />

                  <br /><br />

                  <label for="email">Email:</label>
                  <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                  />

                  <br /><br />

                  <label for="plan">Plan:</label>
                  <select id="plan">
                    <option>Basic</option>
                    <option>Pro</option>
                    <option>Premium</option>
                  </select>
                </fieldset>
              </form>

              <!-- Second Form (hidden initially) -->
              <form id="form-2" style="display: none">
                <fieldset>
                  <legend>Additional Details</legend>

                  <label for="age">Age:</label>
                  <input id="age" type="number" placeholder="Enter your age" />

                  <br /><br />

                  <label for="country">Country:</label>
                  <input
                    id="country"
                    type="text"
                    placeholder="Enter your country"
                  />
                </fieldset>
              </form>
            </section>

            <nav class="navigation" aria-label="Form navigation">
              <button type="button">Back</button>
              <button id="next-btn" type="button">Next</button>
            </nav>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
